# Traduction française de Declic.
# Format : TOML. Les clés sont regroupées par section ; {nom} est remplacé par une valeur.
# Pour les pluriels, une clé est une table des catégories CLDR utilisées par la
# langue (zero, one, two, few, many, other) ; en français : « one » (0 et 1) et « other ».
# Pour proposer une nouvelle langue : copiez ce fichier sous le nom <code>.toml
# (par exemple ca.toml) dans le dossier « lang » placé à côté de declic.exe.

