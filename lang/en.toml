# English translation of Declic (also the fallback for missing keys).
# Format: TOML. Keys are grouped by section; {name} is replaced by a value.
# For plurals, a key is a table of the CLDR plural categories your language
# uses (zero, one, two, few, many, other), e.g. one/few/many in Russian.
# To contribute a language: copy this file as <code>.toml (e.g. ca.toml)
# into a "lang" folder next to declic.exe.

[language]
name = "English"
# Interface font (a Windows font; other fonts are used for missing characters).
font = "Segoe UI"
# "ltr" (left to right) or "rtl" (right to left, e.g. Arabic, Hebrew).
direction = "ltr"

[format]
# Windows locale whose date and number formats are used when the Windows
# regional format is in another language.
locale = "en-US"

