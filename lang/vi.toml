# Declic — Tiếng Việt (vi).
# Machine-assisted translation made from Declic's English and French texts;
# corrections by native speakers are welcome (see README.md).
# Format: TOML. {name} is replaced by a value; plural tables use the CLDR
# categories of the language (other only).

