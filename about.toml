# Configuration of cargo-about, used to generate THIRD-PARTY-LICENSES.txt:
#   cargo about generate about.hbs -o THIRD-PARTY-LICENSES.txt
# Only permissive licenses are accepted (order = preference when a crate
# offers a choice). Declic's own crates are private and therefore ignored.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "BSL-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true

[private]
ignore = true
